name: iOS build & TestFlight upload

# Builds the iPhone app on GitHub's Macs. No Mac needed on your side.
#   - With the App Store Connect secrets below: signs with Apple's cloud-managed certificates
#     and uploads the build to App Store Connect / TestFlight.
#   - Without them: compiles for the simulator only (a check that the project builds).
#
# Run it from the Actions tab → "iOS build & TestFlight upload" → Run workflow.
#
# Secrets (repo → Settings → Secrets and variables → Actions):
#   APPSTORE_KEY_ID      Key ID of an App Store Connect API key with Admin access
#   APPSTORE_ISSUER_ID   Issuer ID shown above the list of API keys
#   APPSTORE_KEY_P8      The whole contents of the downloaded AuthKey_XXXX.p8 file
#   APPLE_TEAM_ID        Your Team ID (optional; defaults to the one below)
#   REVENUECAT_IOS_KEY   RevenueCat public Apple key (appl_…); without it purchases run in test mode

on:
  workflow_dispatch:
  push:
    tags: ['ios-v*']

env:
  TEAM_ID: ${{ secrets.APPLE_TEAM_ID || '9GY8745FR8' }}
  MARKETING_VERSION: '1.0'

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build the game
        env:
          VITE_REVENUECAT_IOS_KEY: ${{ secrets.REVENUECAT_IOS_KEY }}
        run: npm run build

      - name: Copy into the iOS project
        run: npx cap sync ios

      - name: Check for App Store Connect secrets
        id: secrets
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          P8: ${{ secrets.APPSTORE_KEY_P8 }}
        run: |
          if [ -n "$KEY_ID" ] && [ -n "$ISSUER" ] && [ -n "$P8" ]; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
            echo "Secrets found: the build will be signed and uploaded."
          else
            echo "upload=false" >> "$GITHUB_OUTPUT"
            echo "::warning::App Store Connect secrets are not set, so this run only checks that the app compiles. Add APPSTORE_KEY_ID, APPSTORE_ISSUER_ID and APPSTORE_KEY_P8 to upload to TestFlight."
          fi

      # ---------- compile check (no secrets) ----------
      - name: Compile for the simulator
        if: steps.secrets.outputs.upload != 'true'
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40

      # ---------- signed build + upload ----------
      - name: Install the API key
        if: steps.secrets.outputs.upload == 'true'
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          P8: ${{ secrets.APPSTORE_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$P8" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" >> "$GITHUB_ENV"

      - name: Archive (signed with cloud-managed certificates)
        if: steps.secrets.outputs.upload == 'true'
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            | tail -60

      - name: Upload to App Store Connect
        if: steps.secrets.outputs.upload == 'true'
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" \
            | tail -40
          echo "::notice::Uploaded build ${MARKETING_VERSION} (${{ github.run_number }}). It appears in App Store Connect → TestFlight after Apple finishes processing (usually 10–30 minutes)."

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
